method: searched
source: >-
  npm registry search, PyPI, and the Opendatasoft/Huwise GitHub organization,
  probed 2026-07-27. Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and
  crates.io were checked for an Opendatasoft or Electricity North West client and
  returned nothing.
description: >-
  Electricity North West publishes NO client library of its own — it is a
  regulated distribution network operator, not a software vendor, and its API is
  a hosted Opendatasoft (Huwise) Explore API tenant. The client libraries below
  are therefore split into two honest groups: libraries published by the PLATFORM
  VENDOR that owns and versions the Explore API contract (first-party to the API,
  not to the network operator), and clearly third-party community clients. Nothing
  here is authored by Electricity North West.
first_party_to: Opendatasoft SAS (rebranding to Huwise) — the API vendor
first_party_to_provider: false
packages:
- language: javascript
  registry: npm
  name: '@opendatasoft/api-client'
  url: https://www.npmjs.com/package/@opendatasoft/api-client
  install: npm install @opendatasoft/api-client
  version_seen: 21.10.1
  repository: https://github.com/opendatasoft/ods-dataviz-sdk
  official: true
  published_by: Opendatasoft
  note: >-
    The vendor's TypeScript/JavaScript client for the Opendatasoft APIs,
    including the Explore v2.1 catalog/dataset/records endpoints this provider
    serves. Point it at electricitynorthwest.opendatasoft.com to use it here.

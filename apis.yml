apis:
- aid: electricity-north-west:explore-api-v2-1
  name: SP Electricity North West Open Data Explore API v2.1
  description: >-
    The current Opendatasoft Explore REST API v2.1 scoped to the SP Electricity North
    West open data domain. Read-only (GET only, JSON), 16 documented paths covering
    catalogue search over the 146 published datasets, per-dataset metadata and field
    schemas, record query, facets, attachments, and bulk exports in CSV, JSON,
    Parquet, GPX and DCAT-AP. All endpoints accept the Opendatasoft Query Language
    (ODSQL). The OpenAPI 3.0.3 document was harvested verbatim from the live host on
    2026-07-27 and declares a single `apikey` security scheme; an API key is issued
    from a free self-serve portal account.
  humanURL: https://electricitynorthwest.opendatasoft.com/api
  baseURL: https://electricitynorthwest.opendatasoft.com/api/explore/v2.1

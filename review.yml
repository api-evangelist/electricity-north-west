sources:
  - url: https://electricitynorthwest.opendatasoft.com/api/explore/v2.1/swagger.json
    type: OpenAPI
    note: Primary contract. Harvested verbatim 2026-07-27, HTTP 200.
  - url: https://electricitynorthwest.opendatasoft.com/api/v2/swagger.json
    type: OpenAPI
    note: Explore v2.0 contract. Harvested verbatim 2026-07-27, HTTP 200.
  - url: https://electricitynorthwest.opendatasoft.com/api
    type: Portal
    note: The portal's own API page; the only confirmed developer surface.
  - url: https://news.enwl.co.uk/blogs/electricity-north-west-open-data-portal-a-valuable-resource-for-the-energy-sector
    type: Blog
    note: >-
      Company's own account of the portal. Quotes it launched with the embedded
      capacity register and grew to "28 data sets"; states data "can also be
      downloaded in a number of file formats or accessed via API"; cites no Ofgem
      obligation. The live catalogue is now 146 datasets.
  - url: https://www.ofgem.gov.uk/sites/default/files/2024-10/Track_Changes_Data_Best_Practice_Guidance_v301728394292260.pdf
    type: Regulation
    note: >-
      Ofgem Data Best Practice Guidance, the "presumed open" duty applying to RIIO-ED2
      licensees. This is the mandate recorded above.
  - url: https://www.iberdrola.com/press-room/news/detail/sp-electricity-north-west-unveiled-new-name-visual-identity-part-iberdrola-group
    type: News
    note: Iberdrola acquisition and 2025-08-05 rebrand to SP Electricity North West.

actions:
  apisYmlApisListed: 2
  openapiHarvested: true
  specsSaved:
    - openapi/electricity-north-west-explore-api-v2-1-openapi.json
    - openapi/electricity-north-west-explore-api-v2-0-openapi.json
  notListed:
    - surface: https://electricitynorthwest.opendatasoft.com/api/datasets/1.0/search/
      reason: >-
        Legacy Opendatasoft v1 dataset-search endpoint still answers HTTP 200 but is
        not referenced from the portal's API page, has no OpenAPI on this host, and is
        superseded by Explore v2.x. Recorded as an observation, not published as an API.
    - surface: Consumer usage / billing API
      reason: None exists. Nothing was invented to fill the gap.

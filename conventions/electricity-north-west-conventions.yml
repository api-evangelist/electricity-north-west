  lifecycle: lifecycle/electricity-north-west-lifecycle.yml
  authentication: authentication/electricity-north-west-authentication.yml
  scopes: scopes/electricity-north-west-scopes.yml
  rate_limits: rate-limits/electricity-north-west-rate-limits.yml

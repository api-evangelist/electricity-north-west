embed_analytics_headers:
  headers: [ODS-API-Analytics-App, ODS-API-Analytics-Embed-Type, ODS-API-Analytics-Embed-Referrer, ODS-Widgets-Version]
  note: >-
    The API's Access-Control-Allow-Headers list names four embed-analytics headers,
    which is direct evidence that embedding is a first-class, instrumented use
    case for this platform rather than an afterthought.
provider_authored:
- name: SP ENW Future Energy Scenarios visualisation
  url: https://spenw-open-data.github.io/
  repository: https://github.com/spenw-open-data/spenw-open-data.github.io
  kind: standalone web application (not a reusable component)
  description: >-
    A DFES 2025 scenario explorer published by SP Electricity North West on GitHub
    Pages, covering six National Grid ESO-aligned scenarios across BSP, primary,
    county, LAD, Lake District and network geographies. Ships the underlying data
    as static CSV plus GeoJSON boundary files under CC BY 4.0. Configuration-driven
    (scenarios.json / parameters.json) but not distributed as a package.
  note: >-

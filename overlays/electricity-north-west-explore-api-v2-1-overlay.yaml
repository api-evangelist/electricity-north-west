- target: $.info
  description: >-
    Record the alternative authentication forms the vendor documents but the spec
    omits, and the partial-anonymous access model observed live.
  update:
    x-apievangelist-auth-header: 'Authorization: Apikey <API_KEY>'
    x-apievangelist-auth-note: >-
      The spec declares only the `apikey` query parameter. The vendor recommends
      the Authorization header form instead, and also supports a portal session
      cookie and an OAuth2 authorization-code flow (single scope `all`) at
      /oauth2/authorize/ and /oauth2/token/ on this domain.
    x-apievangelist-anonymous-access: >-
      Catalogue and dataset metadata are readable with no credential. Record and
      dataset-export operations return error_code "ForbiddenAccess" anonymously
      and require a free registered account.

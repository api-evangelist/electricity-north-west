    x-apievangelist-page-limit: 100 without group_by; offset + limit must stay under 10000
- target: $.paths['/catalog/datasets/{dataset_id}/exports/{format}']
  description: Bulk retrieval guidance.
  update:
    x-apievangelist-anonymous: false
    x-apievangelist-note: >-
      No record-count limitation. Prefer this over paginating the records endpoint

    x-apievangelist-total-count-observed: 146
    x-apievangelist-anonymous: true
- target: $.paths['/catalog/datasets/{dataset_id}']
  description: >-
    Flag the prerequisite relationship an agent must respect: ODSQL field names
    are dataset-specific and only discoverable here.
  update:
    x-apievangelist-anonymous: true
    x-apievangelist-prerequisite-for: [getRecords, getRecord, getRecordsFacets, exportRecords]
    x-apievangelist-note: >-
      The `fields` array in the response is the only source of valid ODSQL field
      names for that dataset. Querying an unlisted field returns 400 ODSQLError.
- target: $.paths['/catalog/datasets/{dataset_id}/records']
  description: Record the registration wall observed on this domain.
  update:

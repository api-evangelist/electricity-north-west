    x-apievangelist-migration-notes:
      removed_in_v2_1:
      - /api/explore/v2.0/<source>/datasets/<dataset_id>/aggregates
      - /api/explore/v2.0/<source>/datasets/<dataset_id>/query
      merged_into: the single records endpoint
      breaking_changes:
      - XLSX replaces XLS as the spreadsheet export format.
      - The search() ODSQL function changed; suggest() and startswith() were added.
      - Date functions return integers rather than strings.
      - Grouping by geo fields deprecated in favour of geo_cluster().
      - Date aggregation keys formatted as ISO dates rather than timestamps.
      - CSV exports emit a BOM by default.
      - GPX exports use <extension> rather than <desc>.
      - GeoJSON datetimes output as ISO strings rather than integer timestamps.
      changed_response_schemas:
      - /datasets
      - /datasets/{dataset_id}
      - /datasets/{dataset_id}/records
      - /datasets/{dataset_id}/records/{record_id}

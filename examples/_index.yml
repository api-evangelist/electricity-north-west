description: >-
  Worked request/response examples for the SP Electricity North West Explore API,
  including two error cases that matter more than the happy paths: the ODSQL
  validation error a client hits when it guesses a field name, and the
  ForbiddenAccess body that record endpoints return to an anonymous caller on this
  domain.

agent_notes:
- >-
  All 16 tools are read-only. There is no write, no state and no consequence
  beyond quota consumption — the safest possible tool surface.
- >-
  Tool inputs should be inherited verbatim from each operation's OpenAPI
  parameters (the ODSQL clause set: select, where, group_by, order_by, refine,
  exclude, limit, offset, lang, timezone). See mcp/electricity-north-west-tool-crosswalk.yml.
- >-
  An agent MUST call get_dataset before query_records: ODSQL field names are
  dataset-specific and an unknown field returns 400 ODSQLError.
- >-
  Anonymous callers can reach metadata only. query_records and the dataset export
  tools return error_code "ForbiddenAccess" without an API key.
- >-
  Budget against a shared 5000 calls/day domain quota. Prefer export_records over
  paginating query_records.
third_party:
- package: '@pipeworx/mcp-opendatasoft'
  registry: npm
  url: https://www.npmjs.com/package/@pipeworx/mcp-opendatasoft
  description: >-
    "Generic Opendatasoft portal client (3000+ public OpenDataSoft instances)" —
    would work against electricitynorthwest.opendatasoft.com.
  official: false
  endorsed: false
- note: >-
    The same publisher ships ~20 domain-pinned Opendatasoft MCP servers
    (@pipeworx/mcp-data-paris, -odre, -sncf, …). None targets Electricity North
    West.

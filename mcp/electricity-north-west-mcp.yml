method: derived
status: candidate
source: >-
  Tools derived one-per-operationId from
  openapi/electricity-north-west-explore-api-v2-1-openapi.json. Searched first for
  a published server: no MCP endpoint is advertised on the portal or in the vendor
  documentation, /.well-known/oauth-protected-resource and
  /.well-known/oauth-authorization-server both return 404, and no
  first-party package exists in the npm @modelcontextprotocol scope or the MCP
  registries.
description: >-
  Neither Electricity North West nor Opendatasoft (Huwise) publishes an MCP server
  for this API. The tool list below is a CANDIDATE derived mechanically from the
  16 Explore v2.1 operations — it is a design, not a deployment. It is worth
  recording because this API is unusually well suited to MCP: read-only, fully
  CORS-open, uniformly parameterised through ODSQL, and every operation is safe to
  retry. Third-party generic Opendatasoft MCP servers do exist on npm and would
  work against this domain; they are listed under third_party but are not
  endorsed and are not first-party.
server:
  name: electricity-north-west
  transport: null
  url: null
  published: false
tools:
- name: list_datasets
  description: Search the SP Electricity North West catalogue of 146 open datasets with ODSQL.
  source_operation: openapi/electricity-north-west-explore-api-v2-1-openapi.json#getDatasets
  http: GET /catalog/datasets
  auth_required: false
- name: get_dataset
  description: Get one dataset's metadata, licence and field schema by dataset_id.
  source_operation: openapi/electricity-north-west-explore-api-v2-1-openapi.json#getDataset
  http: GET /catalog/datasets/{dataset_id}
  auth_required: false
- name: list_catalog_facets
  description: Enumerate catalogue facet values and counts (licence, theme, keyword).
  source_operation: openapi/electricity-north-west-explore-api-v2-1-openapi.json#getDatasetsFacets

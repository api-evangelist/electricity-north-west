shared_input_contract:
  note: >-
    Every operation accepts the same ODSQL clause set, which is why the tool
    surface is so uniform. These parameters are declared in the OpenAPI and are
    the real inputSchema fields each tool inherits.
  common_parameters:
    select: ODSQL select expression — fields, functions, labelled expressions
    where: ODSQL filter expression with full-text and boolean/functional operators
    group_by: ODSQL aggregation grouping
    order_by: comma-separated fields/aggregations with asc|desc
    refine: facet-value restriction
    exclude: facet-value exclusion
    limit: integer, default 10, max 100 without group_by
    offset: integer, min 0; offset + limit must stay under 10000
    lang: language for localisation
    timezone: timezone for date handling

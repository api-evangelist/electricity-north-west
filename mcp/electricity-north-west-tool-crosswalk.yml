description: >-
  A one-to-one crosswalk, which is the unusual case. Because the candidate MCP
  tool list was derived from the OpenAPI rather than harvested from a running
  server, there are no MCP-only tools and no REST-only operations: the surfaces
  are identical by construction. That makes the crosswalk's value the INPUT
  CONTRACT rather than the mapping — each tool inherits its real parameter set
  from the operation's OpenAPI `parameters`, so an agent gets a genuine
  inputSchema instead of a guessed one. Confidence is high throughout for the
  same reason.
